
name: Build and Deploy Notes App to AWS

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-app-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build backend JAR
        working-directory: ./notes-backend
        run: mvn clean package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./notes-backend
          push: true
          tags: |
            itsweasel/notes-backend:sha-${{ github.sha }}
            itsweasel/notes-backend:v${{ github.run_number }}
            itsweasel/notes-backend:latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./notes-frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            itsweasel/notes-frontend:sha-${{ github.sha }}
            itsweasel/notes-frontend:v${{ github.run_number }}
            itsweasel/notes-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key \
            deploy/compose.prod.yml \
            "ubuntu@$EC2_HOST:/opt/notes-app/compose.prod.yml"

          ssh -i ~/.ssh/deploy_key "ubuntu@$EC2_HOST" \
            "cd /opt/notes-app &&
             sed -i '/^IMAGE_TAG=/d' .env &&
             printf '%s\n' 'IMAGE_TAG=sha-${GITHUB_SHA}' >> .env &&
             chmod 600 .env &&
             docker compose -f compose.prod.yml pull &&
             docker compose -f compose.prod.yml up -d --remove-orphans"
